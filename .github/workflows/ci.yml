# SPEC (Source of Truth):
# - Workflow: Java 24 CI for sugarcoat-labs persistence engines.
# - Triggers: Runs on every push and pull request targeting the main branch.
# - Runtime & Build: Uses Ubuntu latest with Eclipse Temurin JDK 24 and Maven dependency caching.
# - Verification (inbound): Downloads Maven dependencies, compiles the project, runs TCK tests, and generates Javadoc (`mvn -B verify javadoc:javadoc`).
# - Distribution (outbound): On pushes to main only (never on pull requests), publishes compiled Maven artifacts (jars and poms) to GitHub Packages under https://maven.pkg.github.com/sugarcoat-labs using server-id `github-sugarcoat-labs` and `GITHUB_TOKEN`.
# - Permissions: Requires `contents: read` to checkout code and `packages: write` to publish artifacts to GitHub Packages.

name: Java 24 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-sugarcoat-labs
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, run TCK tests, and generate Javadoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify javadoc:javadoc

      - name: Publish to GitHub Packages (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -DskipTests deploy